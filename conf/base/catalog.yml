credit_dataset:
  type: pandas.CSVDataset
  filepath: data/dataset_tesis.csv
  load_args:
    parse_dates:
      - fecha_desembolso

# Kedro v1 reports. The historical thesis artifacts remain in models/, results/ and figures/;
# these datasets provide a reproducible Kedro trace without moving published files.
dataset_validation_report:
  type: json.JSONDataset
  filepath: data/08_reporting/kedro/dataset_validation_report.json

eda_report:
  type: json.JSONDataset
  filepath: data/08_reporting/kedro/eda_report.json

xgboost_metrics_kedro:
  type: json.JSONDataset
  filepath: data/08_reporting/kedro/xgboost_metrics.json

logreg_metrics_kedro:
  type: json.JSONDataset
  filepath: data/08_reporting/kedro/logreg_metrics.json

segment_metrics_kedro:
  type: json.JSONDataset
  filepath: data/08_reporting/kedro/cv_seg_metrics.json

llm_zero_shot_nothink_metrics_kedro:
  type: json.JSONDataset
  filepath: data/08_reporting/kedro/llm_metrics_tabllm_nothink.json

llm_zero_shot_think_metrics_kedro:
  type: json.JSONDataset
  filepath: data/08_reporting/kedro/llm_metrics_tabllm_think.json

llm_few_shot_metrics_kedro:
  type: json.JSONDataset
  filepath: data/08_reporting/kedro/llm_metrics_fewshot.json

comparison_table_kedro:
  type: pandas.CSVDataset
  filepath: data/08_reporting/kedro/tabla_comparacion_final.csv
  save_args:
    index: false

thesis_artifact_report:
  type: json.JSONDataset
  filepath: data/08_reporting/kedro/thesis_artifact_report.json
