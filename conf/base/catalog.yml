# Catálogo único (huella spaceflights). Regla dura: TODO output persistido está acá;
# ningún nodo hace I/O propio. Factories para lo que generamos, entradas explícitas
# para rutas publicadas históricas (models/*.json, results/*.csv) y evidencia frozen.

# --- Entrada e intermedios de datos ---
credit_dataset:
  type: pandas.CSVDataset
  filepath: data/dataset_tesis.csv
  load_args:
    parse_dates:
      - fecha_desembolso

model_input_table:
  type: pandas.ParquetDataset
  filepath: data/04_feature/model_input_table.parquet

# --- Reportes de data_processing ---
dataset_validation_report:
  type: json.JSONDataset
  filepath: data/08_reporting/kedro/dataset_validation_report.json

eda_report:
  type: json.JSONDataset
  filepath: data/08_reporting/kedro/eda_report.json

# --- data_science: modelos (factory sobre el namespace) ---
"{namespace}.classifier":
  type: pickle.PickleDataset
  filepath: data/06_models/{namespace}_classifier.pkl

# Métricas de los clásicos citables → rutas PUBLICADAS históricas (paridad E4).
xgb.metrics:
  type: json.JSONDataset
  filepath: models/xgboost_metrics.json
logreg.metrics:
  type: json.JSONDataset
  filepath: models/logreg_metrics.json

# Resto de métricas de modelos (leak, tabfm, brazos) → factory bajo reporting.
"{namespace}.metrics":
  type: json.JSONDataset
  filepath: data/08_reporting/models/{namespace}_metrics.json

# CV temporal por segmento → ruta publicada.
cv_seg_metrics:
  type: json.JSONDataset
  filepath: models/cv_seg_metrics.json
