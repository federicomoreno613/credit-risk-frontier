# Catálogo mínimo de la cohorte y de la entrega intermedia vigente.

# ---------------------------------------------------------------------
# Reconstrucción de la cohorte
# ---------------------------------------------------------------------
credit_dataset:
  type: pandas.CSVDataset
  filepath: data/01_raw/credit_applications_anonymized.csv
  load_args:
    parse_dates: [fecha_desembolso]

legacy_model_dataset:
  type: pandas.CSVDataset
  filepath: data/03_primary/02_dataset_modelo.csv

payment_schedule:
  type: pandas.CSVDataset
  filepath: data/01_raw/01_pagos_cuota.csv
  load_args:
    parse_dates: [fecha_desembolso, fecha_t_pago, fecha_pago]

credit_bridge:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/credit_bridge.parquet

credit_outcomes_150d:
  type: pandas.ParquetDataset
  filepath: data/03_primary/credit_outcomes_150d.parquet

model_input_table:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/model_input_table.parquet

bridge_coverage_report:
  type: json.JSONDataset
  filepath: data/08_reporting/intermedia_20260714_redesign/bridge_coverage.json

split_manifest:
  type: json.JSONDataset
  filepath: data/08_reporting/intermedia_20260714_redesign/split_manifest.json

outcome_sensitivity_report:
  type: json.JSONDataset
  filepath: data/08_reporting/intermedia_20260714_redesign/outcome_sensitivity.json

dataset_validation_report:
  type: json.JSONDataset
  filepath: data/08_reporting/intermedia_20260714_redesign/dataset_validation_report.json

# ---------------------------------------------------------------------
# Contrato del estudio: TransUnion 20, formulario directo 9 y descripción
