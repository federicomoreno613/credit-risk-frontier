[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "credit_risk_frontier"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "kedro~=1.2.0",
    "kedro-datasets[pandas-csvdataset, pandas-parquetdataset, matplotlib-matplotlibdataset, json-jsondataset]>=3.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn==1.5.2",
    "xgboost==2.1.4",
    "optuna==4.1.0",
    "matplotlib>=3.8",
    "requests>=2.32",
    "PyYAML>=6.0",
    "pytest>=8.0",
]

[project.scripts]
credit-risk-frontier = "credit_risk_frontier.__main__:main"

[project.entry-points."kedro.hooks"]

[tool.setuptools.dynamic.version]
attr = "credit_risk_frontier.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.poetry]
version = "0.1.0"

[tool.kedro]
package_name = "credit_risk_frontier"
project_name = "credit_risk_frontier"
kedro_init_version = "1.2.0"
tools = "['Data Structure']"
example_pipeline = "False"
source_dir = "src"

[tool.kedro_telemetry]
project_id = "86f93a0d69d24e16ae0a48cc70eb32ac"

[tool.pytest.ini_options]
pythonpath = [
    "src",
]

[tool.jupytext]
formats = "nbs///py:percent,notebooks///ipynb"
