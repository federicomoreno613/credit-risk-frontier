[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "credit_risk_frontier"
readme = "README.md"
dynamic = [
    "version",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn==1.5.2",
    "xgboost==2.1.4",
    "optuna==4.1.0",
    "matplotlib>=3.8",
    "requests>=2.32",
    "pytest>=8.0",
    "pyarrow>=15.0",
    "joblib>=1.3",
    "openai (>=3.3.1,<4.0.0)",
    "tabpfn (>=2.2,<3.0)",
]

[tool.setuptools.dynamic.version]
attr = "credit_risk_frontier.__version__"

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.poetry]
version = "0.1.0"

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
